name: Stratum browser bundle

on:
  push:
    branches: ['stratum/**']
  workflow_dispatch:

env:
  STOCK_IMAGE: collabora/code:26.04.5.1.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkgconf m4 rsync python3-lxml python3-polib
      - name: Build browser bundle
        run: stratum/build-browser.sh
      - name: Size and file list
        working-directory: stratum/out/usr/share/coolwsd/browser
        run: |
          du -sh dist admin-templates
          find dist -type f | wc -l
          find dist admin-templates -type f -printf '%s\t%p\n' | sort -k2
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: stratum/out/usr/share/coolwsd/browser
          include-hidden-files: true

  compare-with-stock:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: built
      - name: Copy the stock image's browser tree
        run: |
          docker pull "$STOCK_IMAGE"
          docker create --name stock "$STOCK_IMAGE"
          docker cp stock:/usr/share/coolwsd/browser stock
          docker image inspect "$STOCK_IMAGE" --format '{{json .Config.Labels}}'
      - name: Compare file names and sizes
        env:
          LC_ALL: C
        run: |
          list() { (cd "$1" && find . -type f -printf '%P\t%s\n' | sort -t$'\t' -k1,1); }
          list stock > stock.tsv
          list built > built.tsv
          echo "stock: $(wc -l < stock.tsv) files, $(du -sb stock | cut -f1) bytes; built: $(wc -l < built.tsv) files, $(du -sb built | cut -f1) bytes"
          echo "--- only in stock"
          join -t$'\t' -v1 stock.tsv built.tsv | cut -f1
          echo "--- only in built"
          join -t$'\t' -v2 stock.tsv built.tsv | cut -f1
          echo "--- in both, size differs (path, stock, built)"
          join -t$'\t' stock.tsv built.tsv | awk -F'\t' '$2 != $3'
          echo "--- in both, same size but different bytes"
          join -t$'\t' stock.tsv built.tsv | awk -F'\t' '$2 == $3 {print $1}' | while read -r f; do cmp -s "stock/$f" "built/$f" || echo "$f"; done
          echo "--- identical files: $(join -t$'\t' stock.tsv built.tsv | awk -F'\t' '$2 == $3 {print $1}' | while read -r f; do cmp -s "stock/$f" "built/$f" && echo x; done | wc -l)"
      - name: Where differing files differ
        shell: python3 {0}
        run: |
          import os, re, struct
          from collections import Counter

          def png_chunks(data):
              chunks, i = [], 8
              while i < len(data):
                  length, kind = struct.unpack(">I4s", data[i:i + 8])
                  chunks.append((kind.decode(), data[i + 8:i + 8 + length]))
                  i += 12 + length
              return chunks

          for top, _, files in os.walk("stock"):
              for name in sorted(files):
                  rel = os.path.relpath(os.path.join(top, name), "stock")
                  built = os.path.join("built", rel)
                  if not os.path.isfile(built):
                      continue
                  a, b = open(os.path.join("stock", rel), "rb").read(), open(built, "rb").read()
                  if a == b:
                      continue
                  if rel.endswith(".png"):
                      ca, cb = png_chunks(a), png_chunks(b)
                      same_pixels = [c for c in ca if c[0] == "IDAT"] == [c for c in cb if c[0] == "IDAT"]
                      meta = sorted({k for k, v in ca if (k, v) not in cb} | {k for k, v in cb if (k, v) not in ca})
                      print(f"{rel}: png, pixels {'identical' if same_pixels else 'DIFFER'}, chunks differing: {meta}")
                  else:
                      # esbuild's --line-limit puts newlines wherever the text before them ends, so compare without them.
                      a, b = a.replace(b"\n", b""), b.replace(b"\n", b"")
                      start = next((i for i, (x, y) in enumerate(zip(a, b)) if x != y), min(len(a), len(b)))
                      end = next((i for i, (x, y) in enumerate(zip(a[::-1], b[::-1])) if x != y), 0)
                      print(f"{rel}: ignoring newlines {len(a)} vs {len(b)} bytes; differs in [{start}, {len(a) - end}) of stock;"
                            f" same bytes reordered: {Counter(a) == Counter(b)}")
                      for label, data in (("stock", a), ("built", b)):
                          print(f"  {label} span starts:", data[max(0, start - 40):start + 80])
                          print(f"  {label} span ends:  ", data[max(0, len(data) - end - 80):len(data) - end + 40])
                      for label, data in (("stock", a), ("built", b)):
                          locales = [x or y for x, y in re.findall(rb'regional(?:\.(\w+)|\["([\w-]+)"\])=\{', data)]
                          print(f"  {label} datepicker locale order:", b" ".join(locales).decode())
